name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/context-lint ./cmd/context-lint
      - run: go run ./cmd/context-lint --strict
